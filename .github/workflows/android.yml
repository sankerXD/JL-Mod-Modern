name: Android CI

# snapvm is a composite build (includeBuild "../snapvm"), so both repos are
# checked out side by side under the workspace:
#   <workspace>/JL-Modern   (this repo)
#   <workspace>/snapvm      (github.com/sankerXD/snapvm)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - modern
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: JL-Modern

      - name: Checkout snapvm (sibling of the app repo)
        uses: actions/checkout@v4
        with:
          repository: sankerXD/snapvm
          path: snapvm

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY }}
          ENCODED_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        working-directory: JL-Modern
        run: |
          if [ -z "$ENCODED_PROPS" ]; then
            echo "no signing secrets — release apk will be unsigned"
            exit 0
          fi
          echo "$ENCODED_PROPS" | base64 -di > keystore.properties
          # storeFile is a local absolute path (e.g. ~/.android/debug.keystore)
          # — repoint it at the decoded file
          echo "$ENCODED_KEYSTORE" | base64 -di > ci.keystore
          sed -i 's|^storeFile=.*|storeFile=ci.keystore|' keystore.properties

      - name: Build release + debug
        working-directory: JL-Modern
        run: |
          chmod +x gradlew
          ./gradlew verifyBundledShaders assembleEmulatorRelease assembleEmulatorDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jlmodern-apks
          path: |
            JL-Modern/app/build/outputs/apk/emulator/release/*.apk
            JL-Modern/app/build/outputs/apk/emulator/debug/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: JL-Modern
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "JL-Modern $TAG" \
            --generate-notes \
            app/build/outputs/apk/emulator/release/*.apk
